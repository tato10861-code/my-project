name: PropAuto Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # pnpm must be on PATH before setup-node can use `cache: pnpm`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version-file: src/src/.nvmrc
          cache: pnpm
          cache-dependency-path: src/src/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm check
        env:
          NEXT_PUBLIC_ENV: production

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check tracked files for credential patterns
        shell: bash
        run: |
          # Provider key prefixes: OpenAI/Anthropic (sk-), Stripe live/restricted,
          # Resend, GitHub, AWS, Slack, private key blocks.
          pattern='(^|[^A-Za-z0-9])(sk-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|re_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -n -I -E "$pattern" -- . ':!*.lock' ':!*lock.yaml' ':!*lock.json' ':!*.zip'; then
            echo 'Potential secret detected in tracked files.'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$'; then
            echo 'A .env file is tracked. Remove it and rotate its values.'
            exit 1
          fi
