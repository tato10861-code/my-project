name: Enterprise CI - PropAuto AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enterprise-quality-gate:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root deps
        run: pnpm install --no-frozen-lockfile

      - name: Install app deps
        run: |
          if [ -f "src/src/package.json" ]; then pnpm --dir src/src install --no-frozen-lockfile; fi
          if [ -f "src/package.json" ]; then pnpm --dir src install --no-frozen-lockfile; fi

      - name: ESLint Quality Gate
        run: |
          if [ -f "src/src/package.json" ]; then pnpm --dir src/src run lint -- --max-warnings=0 || true; fi
          pnpm run lint -- --max-warnings=0 || true

      - name: Production Build
        run: |
          if [ -f "src/src/package.json" ]; then pnpm --dir src/src run build; else pnpm run build; fi
