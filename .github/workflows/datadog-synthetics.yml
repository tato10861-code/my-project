# Runs Datadog Synthetic tests on demand. Skipped (not failed) until the
# DD_API_KEY and DD_APP_KEY repository secrets are configured.
name: Run Datadog Synthetic tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@v4.1.1
        with:
          api-key: ${{ env.DD_API_KEY }}
          app-key: ${{ env.DD_APP_KEY }}
          test-search-query: 'tag:e2e-tests'

      - name: Report skipped run
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' }}
        run: echo "Datadog tests skipped because DD_API_KEY and DD_APP_KEY are not configured."
