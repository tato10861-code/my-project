name: Run Datadog Synthetic tests

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@v1.4.0
        with:
          apiKey: ${{ env.DD_API_KEY }}
          appKey: ${{ env.DD_APP_KEY }}
          testSearchQuery: tag:e2e-tests
      - name: Explain skipped Datadog tests
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' }}
        run: echo 'Datadog tests skipped because DD_API_KEY and DD_APP_KEY are not configured.'
