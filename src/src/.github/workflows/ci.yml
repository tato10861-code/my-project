name: PropAuto Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Security audit
        run: pnpm audit --prod --audit-level high
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_ENV: production
      - name: Check tracked secret patterns
        shell: bash
        run: |
          if git grep -n -E '(^|[^A-Za-z])sk-[A-Za-z0-9_-]+' -- '*.ts' '*.tsx' '*.js' '*.jsx'; then
            echo 'Potential secret detected in tracked source files.'
            exit 1
          fi
